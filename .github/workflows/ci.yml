name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: cfn-lint infra/template.yaml infra/waf.yaml
      - run: python -m pytest -q
      - run: python -m surakshit activation-backtest
      - run: make bundle && python -c "import sys; sys.path.insert(0, 'build/lambda'); import surakshit.aws.handlers, surakshit.aws.authorizer"
